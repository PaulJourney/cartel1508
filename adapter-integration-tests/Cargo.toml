version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anchor-lang = "=1.1.2"
anchor-litesvm = "=0.4.0"
litesvm-utils = "=0.4.0"
service_referral_protocol = { path = "../programs/service_referral_protocol", features = ["no-entrypoint"] }
