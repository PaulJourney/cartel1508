[package]
name = "service_referral_protocol"
version = "0.9.0"
description = "Ownerless Solana service referral accounting protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "service_referral_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
production = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["token", "associated_token"] }
