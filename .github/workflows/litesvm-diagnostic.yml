name: litesvm-diagnostic

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - .github/workflows/litesvm-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Build development artifact
        run: anchor build --ignore-keys
      - name: Capture focused LiteSVM failure
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets -- --nocapture > /tmp/litesvm.log 2>&1
          status=$?
          set -e
          {
            echo "LITESVM_EXIT_STATUS=$status"
            echo "--- focused failure lines ---"
            grep -E -B 8 -A 20 'FAILED|panicked at|assertion `left == right` failed|assertion failed|Error:|error: test failed|ProgramFailedToComplete|custom program error|AnchorError|SMOKE INVARIANT' /tmp/litesvm.log || true
            echo "--- final 120 lines ---"
            tail -n 120 /tmp/litesvm.log
          } > LITESVM_DIAGNOSTIC.txt
      - name: Commit diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LITESVM_DIAGNOSTIC.txt
          git commit -m "capture LiteSVM failure diagnostic"
          git push origin HEAD:agent/qualified-revenue-final-integration
