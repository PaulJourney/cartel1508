name: remove-unit-batch-rent

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/remove-unit-batch-rent.py
      - .github/workflows/remove-unit-batch-rent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Remove per-purchase rent account
        run: python3 scripts/remove-unit-batch-rent.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/remove-unit-batch-rent.py .github/workflows/remove-unit-batch-rent.yml
      - name: Commit rent optimization
        run: |
          if git diff --quiet; then
            echo "Optimization already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol integration-tests/tests scripts/static-gates.py scripts/devnet-transaction-smoke.mjs README.md
          git commit -m "replace per-purchase UnitBatch rent with event"
          git push origin HEAD:agent/qualified-revenue-final-integration
