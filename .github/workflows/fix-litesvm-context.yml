name: fix-litesvm-context

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/fix-litesvm-context.py
      - .github/workflows/fix-litesvm-context.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Apply harness fix
        run: python3 scripts/fix-litesvm-context.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/fix-litesvm-context.py .github/workflows/fix-litesvm-context.yml
      - name: Commit harness fix
        run: |
          if git diff --quiet; then
            echo "Harness already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration-tests/tests
          git commit -m "fix LiteSVM AnchorContext test harness"
          git push origin HEAD:agent/qualified-revenue-final-integration
