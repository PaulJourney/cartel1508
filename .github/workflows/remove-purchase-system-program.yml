name: remove-purchase-system-program

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/remove-purchase-system-program.py
      - .github/workflows/remove-purchase-system-program.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Remove purchase SystemProgram fields
        run: python3 scripts/remove-purchase-system-program.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/remove-purchase-system-program.py .github/workflows/remove-purchase-system-program.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration-tests/tests scripts/devnet-transaction-smoke.mjs
          git commit -m "remove stale SystemProgram from purchase clients"
          git push origin HEAD:agent/qualified-revenue-final-integration
