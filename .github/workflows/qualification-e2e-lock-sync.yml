name: qualification-e2e-lock-sync
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
permissions:
  contents: write
jobs:
  qualification-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Generate integration lock and build three programs
        run: |
          cargo generate-lockfile --manifest-path integration-tests/Cargo.toml
          anchor build --ignore-keys
      - name: Inspect SPL dependency graph
        run: |
          cargo tree --manifest-path integration-tests/Cargo.toml -i spl-token || true
          cargo tree --manifest-path integration-tests/Cargo.toml -i solana-program || true
          cargo tree --manifest-path integration-tests/Cargo.toml -i anchor-spl || true
      - name: Re-run proven economic fixture under current graph
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --test economic -- --nocapture
      - name: Run referral bootstrap probe with adapter PDA source
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_bootstrap_probe -- --nocapture
      - name: Run host linkage probe for additional Anchor programs
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_linkage_probe -- --nocapture
      - name: Run atomic qualification end-to-end test
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e -- --nocapture
      - name: Commit integration lock and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/Cargo.lock
          git rm .github/workflows/qualification-e2e-lock-sync.yml
          git commit -m 'lock qualification end-to-end dependencies'
          git push origin HEAD:agent/revenue-adapter-v0.1
