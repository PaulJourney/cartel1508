name: qualification-linkage-runtime-diagnostic
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/qualification-linkage-runtime-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Align evidence API and instrument initialize accounts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integration-tests/tests/qualification_e2e.rs')
          r = p.read_text()
          r = r.replace('    nonce: [u8; 32],', '    evidence_hash: [u8; 32],')
          old = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n            &nonce,\n        ],'''
          new = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            evidence_hash.as_ref(),\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n        ],'''
          if old not in r:
              raise SystemExit('old event seed layout missing')
          r = r.replace(old, new, 1)
          r = r.replace('nonce_1', 'evidence_hash_1').replace('nonce_2', 'evidence_hash_2')
          r = r.replace('client_nonce:', 'evidence_hash:')

          clock_anchor = '''    let registration_open_at = ctx.svm.get_sysvar::<Clock>().unix_timestamp;\n'''
          mint_probe = '''    for (label, mint_key) in [("usdt", usdt_mint.pubkey()), ("usdc", usdc_mint.pubkey())] {\n        let account = ctx.svm.get_account(&mint_key).expect("mint must exist before Initialize");\n        eprintln!("TARGET_MINT {label} key={mint_key} owner={} len={} lamports={} decimals_byte={} initialized_byte={}", account.owner, account.data.len(), account.lamports, account.data[44], account.data[45]);\n        assert_eq!(account.owner, spl_token::id(), "target mint owner must be legacy SPL Token");\n        assert_eq!(account.data.len(), 82, "target mint must have canonical Mint length");\n        assert_eq!(account.data[44], 6, "target mint decimals byte must be six");\n        assert_eq!(account.data[45], 1, "target mint initialized byte must be true");\n    }\n\n''' + clock_anchor
          if clock_anchor not in r:
              raise SystemExit('registration clock anchor missing')
          r = r.replace(clock_anchor, mint_probe, 1)

          ix_anchor = '''        .instruction()\n        .expect("build protocol initialize");\n'''
          ix_probe = ix_anchor + '''    eprintln!("INIT_PROGRAM {} expected={}", initialize_protocol_ix.program_id, service_referral_protocol::ID);\n    eprintln!("EXPECTED_KEYS initializer={} treasury={} usdt={} usdc={} protocol={} vault={} root={} system={}", initializer.pubkey(), treasury.pubkey(), usdt_mint.pubkey(), usdc_mint.pubkey(), protocol_pda, vault_authority, technical_root, anchor_lang::system_program::ID);\n    for (i, meta) in initialize_protocol_ix.accounts.iter().enumerate() {\n        eprintln!("INIT_META {i} key={} signer={} writable={}", meta.pubkey, meta.is_signer, meta.is_writable);\n    }\n    assert_eq!(initialize_protocol_ix.program_id, service_referral_protocol::ID);\n    assert_eq!(initialize_protocol_ix.accounts.len(), 8);\n    assert_eq!(initialize_protocol_ix.accounts[0].pubkey, initializer.pubkey());\n    assert_eq!(initialize_protocol_ix.accounts[1].pubkey, treasury.pubkey());\n    assert_eq!(initialize_protocol_ix.accounts[2].pubkey, usdt_mint.pubkey());\n    assert_eq!(initialize_protocol_ix.accounts[3].pubkey, usdc_mint.pubkey());\n    assert_eq!(initialize_protocol_ix.accounts[4].pubkey, protocol_pda);\n    assert_eq!(initialize_protocol_ix.accounts[5].pubkey, vault_authority);\n    assert_eq!(initialize_protocol_ix.accounts[6].pubkey, technical_root);\n    assert_eq!(initialize_protocol_ix.accounts[7].pubkey, anchor_lang::system_program::ID);\n    for meta in &initialize_protocol_ix.accounts {\n        if let Some(account) = ctx.svm.get_account(&meta.pubkey) {\n            eprintln!("META_STATE key={} owner={} len={} lamports={}", meta.pubkey, account.owner, account.data.len(), account.lamports);\n        } else {\n            eprintln!("META_STATE key={} ABSENT", meta.pubkey);\n        }\n    }\n'''
          if ix_anchor not in r:
              raise SystemExit('protocol initialize instruction anchor missing')
          r = r.replace(ix_anchor, ix_probe, 1)
          p.write_text(r)
          PY
      - name: Build programs and target
        run: |
          anchor build --ignore-keys
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e --no-run
      - name: Instrumented full E2E target
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e -- --nocapture
