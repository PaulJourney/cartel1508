name: apply-e2e-clock-api-fix
on:
  push:
    branches: [agent/revenue-qualification-e2e]
permissions:
  contents: write
jobs:
  patch-test-clock-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-qualification-e2e
      - name: Use LiteSVM 0.11 Clock sysvar API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('integration-tests/tests/qualified_revenue_e2e.rs')
          text = path.read_text()
          old = '''    // LiteSVM starts at Unix timestamp 0. Production evidence requires a\n    // strictly positive settlement timestamp, so pin the test clock explicitly.\n    ctx.svm.warp_to_timestamp(1_700_000_000);\n'''
          new = '''    // LiteSVM starts at Unix timestamp 0. Production evidence requires a\n    // strictly positive settlement timestamp, so pin the Clock sysvar explicitly.\n    let mut test_clock = ctx.svm.get_sysvar::<Clock>();\n    test_clock.unix_timestamp = 1_700_000_000;\n    ctx.svm.set_sysvar(&test_clock);\n'''
          if old not in text:
              raise SystemExit('expected warp_to_timestamp block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test clock API fix and remove one-shot workflow
        run: |
          rm -f QUALIFIED_REVENUE_E2E_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/tests/qualified_revenue_e2e.rs
          git add -u QUALIFIED_REVENUE_E2E_FAILURE.log || true
          git rm .github/workflows/apply-e2e-clock-api-fix.yml
          git commit -m 'use locked LiteSVM Clock sysvar API in E2E'
          git push origin HEAD:agent/revenue-qualification-e2e
