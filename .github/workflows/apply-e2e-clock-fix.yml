name: apply-e2e-clock-fix
on:
  push:
    branches: [agent/revenue-qualification-e2e]
permissions:
  contents: write
jobs:
  patch-test-clock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-qualification-e2e
      - name: Set deterministic positive LiteSVM timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('integration-tests/tests/qualified_revenue_e2e.rs')
          text = path.read_text()
          needle = '''    let mut ctx = AnchorLiteSVM::build_with_programs(&[\n        (service_referral_protocol::ID, CORE_BYTES),\n        (revenue_adapter::ID, ADAPTER_BYTES),\n        (revenue_qualification::ID, QUALIFICATION_BYTES),\n        (test_revenue_evidence_stub::ID, EVIDENCE_BYTES),\n    ]);\n'''
          replacement = needle + '''\n    // LiteSVM starts at Unix timestamp 0. Production evidence requires a\n    // strictly positive settlement timestamp, so pin the test clock explicitly.\n    ctx.svm.warp_to_timestamp(1_700_000_000);\n'''
          if needle not in text:
              raise SystemExit('expected AnchorLiteSVM setup block not found')
          if 'ctx.svm.warp_to_timestamp(1_700_000_000);' in text:
              raise SystemExit('timestamp patch already present')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Commit test-only clock fix and remove one-shot workflow
        run: |
          rm -f QUALIFIED_REVENUE_E2E_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/tests/qualified_revenue_e2e.rs
          git add -u QUALIFIED_REVENUE_E2E_FAILURE.log || true
          git rm .github/workflows/apply-e2e-clock-fix.yml
          git commit -m 'fix LiteSVM revenue evidence test clock'
          git push origin HEAD:agent/revenue-qualification-e2e
