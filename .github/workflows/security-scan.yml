name: rustsec-security-scan
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/security-scan.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'programs/**/Cargo.toml'
  pull_request:
    paths:
      - '.github/workflows/security-scan.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'programs/**/Cargo.toml'
permissions:
  contents: read
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Scan three-program production Cargo.lock against RustSec
        run: |
          set -o pipefail
          cargo audit --json | tee cargo-audit.json
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustsec-cargo-audit-three-program
          path: cargo-audit.json
          if-no-files-found: warn
