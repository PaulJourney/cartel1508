name: evidence-api-migration
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/evidence-api-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Migrate test/smoke callers from nonce to evidence hash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          smoke = Path('scripts/qualification-localnet-smoke.mjs')
          s = smoke.read_text()
          s = s.replace('nonce', 'evidence')
          old = '[EVENT_DOMAIN, payer.toBuffer(), beneficiary.toBuffer(), mint.toBuffer(), u64le(amount), evidence]'
          new = '[EVENT_DOMAIN, evidence, payer.toBuffer(), beneficiary.toBuffer(), mint.toBuffer(), u64le(amount)]'
          if old not in s:
              raise SystemExit('smoke eventId seed layout not found after rename')
          s = s.replace(old, new)
          s = s.replace('client evidence', 'qualification evidence')
          smoke.write_text(s)

          e2e = Path('integration-tests/tests/qualification_e2e.rs')
          r = e2e.read_text().replace('nonce', 'evidence')
          old_rust = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n            &evidence,\n        ],'''
          new_rust = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            &evidence,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n        ],'''
          if old_rust not in r:
              raise SystemExit('LiteSVM event-id seed layout not found after rename')
          r = r.replace(old_rust, new_rust)
          e2e.write_text(r)

          static = Path('scripts/static-gates.py')
          g = static.read_text()
          g = g.replace("'&client_nonce'", "'evidence_hash.as_ref()'")
          g = g.replace('payer beneficiary mint amount nonce', 'evidence payer beneficiary mint amount')
          static.write_text(g)
          PY
      - name: Verify evidence-bound ABI across workspace and integration targets
        run: |
          cargo check --locked --workspace
          anchor build --ignore-keys
          cargo test --locked --workspace
          cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets --no-run
          python3 scripts/static-gates.py
      - name: Commit migration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qualification-localnet-smoke.mjs integration-tests/tests/qualification_e2e.rs scripts/static-gates.py
          git rm .github/workflows/evidence-api-migration.yml
          git commit -m 'migrate qualification tests to evidence-bound identity'
          git push origin HEAD:agent/revenue-adapter-v0.1
