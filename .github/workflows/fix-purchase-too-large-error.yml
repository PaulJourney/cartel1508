name: fix-purchase-too-large-error

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/fix-purchase-too-large-error.py
      - .github/workflows/fix-purchase-too-large-error.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Rename purchase size error
        run: python3 scripts/fix-purchase-too-large-error.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/fix-purchase-too-large-error.py .github/workflows/fix-purchase-too-large-error.yml
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs
          git commit -m "fix purchase size error variant"
          git push origin HEAD:agent/qualified-revenue-final-integration
