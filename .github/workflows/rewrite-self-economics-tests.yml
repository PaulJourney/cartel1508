name: rewrite-self-economics-tests

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/rewrite-self-economics-tests.py
      - .github/workflows/rewrite-self-economics-tests.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Rewrite SELF economics tests
        run: python3 scripts/rewrite-self-economics-tests.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/rewrite-self-economics-tests.py .github/workflows/rewrite-self-economics-tests.yml
      - name: Commit rewritten tests
        run: |
          if git diff --quiet; then
            echo "Tests already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration-tests/tests
          git commit -m "align integration tests with SELF plus nine uplines"
          git push origin HEAD:agent/qualified-revenue-final-integration
