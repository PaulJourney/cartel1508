name: mainnet-freeze-one-shot

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - .github/workflows/mainnet-freeze-one-shot.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0

      - name: Apply exact final freeze
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          program_id = "DA214e5LFbj1WARXzu89k295azhKCGMFcVicsm7CsfpL"
          timestamp = "1_787_288_400"

          lib_path = Path("programs/service_referral_protocol/src/lib.rs")
          lib = lib_path.read_text()
          old_id = 'declare_id!("4AuoBkj4vkH2K1jwUuECtVBqF6Q74efjGbaw7btuNjRV");'
          new_id = f'declare_id!("{program_id}");'
          assert lib.count(old_id) == 1, "unexpected old declare_id count"
          assert new_id not in lib, "new declare_id already present unexpectedly"
          lib_path.write_text(lib.replace(old_id, new_id, 1))

          gates_path = Path("scripts/static-gates.py")
          gates = gates_path.read_text()
          old_gate = "    'production launch time remains fail closed': 'MAINNET_REGISTRATION_OPEN_AT: i64 = 0' in constants,"
          new_gate = f"    'production launch time is frozen exactly': 'MAINNET_REGISTRATION_OPEN_AT: i64 = {timestamp}' in constants,\n    'mainnet program id is frozen exactly': 'declare_id!(\\\"{program_id}\\\")' in source,"
          assert gates.count(old_gate) == 1, "unexpected old launch gate count"
          gates_path.write_text(gates.replace(old_gate, new_gate, 1))

          constants = Path("programs/service_referral_protocol/src/constants.rs").read_text()
          anchor = Path("Anchor.toml").read_text()
          assert f"MAINNET_REGISTRATION_OPEN_AT: i64 = {timestamp}" in constants
          assert '[programs.mainnet]' in anchor
          assert f'service_referral_protocol = "{program_id}"' in anchor
          assert new_id in lib_path.read_text()
          assert f"MAINNET_REGISTRATION_OPEN_AT: i64 = {timestamp}" in gates_path.read_text()
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/mainnet-freeze-one-shot.yml

      - name: Commit exact freeze
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs scripts/static-gates.py .github/workflows/mainnet-freeze-one-shot.yml
          git diff --cached --check
          git diff --cached -- programs/service_referral_protocol/src/lib.rs scripts/static-gates.py
          git commit -m "freeze mainnet program identity and gates"
          git push origin HEAD:agent/qualified-revenue-final-integration
