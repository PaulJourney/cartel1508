name: apply-e2e-replay-blockhash-fix
on:
  push:
    branches: [agent/revenue-qualification-e2e]
permissions:
  contents: write
jobs:
  patch-replay-blockhash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-qualification-e2e
      - name: Expire LiteSVM blockhash before identical replay funding transaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('integration-tests/tests/qualified_revenue_e2e.rs')
          text = path.read_text()
          old = '''    ctx.svm\n        .mint_to(\n            &usdc_mint.pubkey(),\n            &revenue_usdc,\n            &initializer,\n            revenue_amount,\n        )\n        .expect("re-fund for replay test");\n    ctx.svm.expire_blockhash();\n'''
          new = '''    // The replay re-fund is byte-for-byte identical to the earlier mint. Rotate\n    // LiteSVM's recent blockhash first so the helper transaction is not rejected\n    // as AlreadyProcessed before the protocol replay check is reached.\n    ctx.svm.expire_blockhash();\n    ctx.svm\n        .mint_to(\n            &usdc_mint.pubkey(),\n            &revenue_usdc,\n            &initializer,\n            revenue_amount,\n        )\n        .expect("re-fund for replay test");\n'''
          if old not in text:
              raise SystemExit('expected replay re-fund block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit replay blockhash fix and remove one-shot workflow
        run: |
          rm -f QUALIFIED_REVENUE_E2E_FAILURE.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/tests/qualified_revenue_e2e.rs
          git add -u QUALIFIED_REVENUE_E2E_FAILURE.log || true
          git rm .github/workflows/apply-e2e-replay-blockhash-fix.yml
          git commit -m 'fix LiteSVM replay funding blockhash in E2E'
          git push origin HEAD:agent/revenue-qualification-e2e
