name: protocol-ci
on:
  push:
  pull_request:

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana / Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Anchor 1.1.2 binary
        run: |
          rm -f /tmp/anchor
          curl --http1.1 -L --fail --retry 10 --retry-all-errors --retry-delay 2 \
            https://github.com/otter-sec/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu \
            -o /tmp/anchor
          echo "fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1  /tmp/anchor" | sha256sum -c -
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor --version
          solana --version
          rustc --version
      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
