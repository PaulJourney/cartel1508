name: protocol-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Apply one-time SPL mint hardening migration
        run: python3 scripts/migrate-mint-hardening.py
      - name: Static gates on hardened source
        run: python3 scripts/static-gates.py
      - name: Type-check production feature
        run: cargo check -p service_referral_protocol --features production
      - name: Build hardened V0.9 source
        run: anchor build --ignore-keys
      - name: Program Rust unit tests
        run: cargo test --workspace
      - name: LiteSVM baseline tests
        run: cargo test --manifest-path integration-tests/Cargo.toml --lib -- --nocapture
      - name: LiteSVM initialization security tests
        run: cargo test --manifest-path integration-tests/Cargo.toml --test initialization_security -- --nocapture
      - name: LiteSVM economic accounting test
        run: cargo test --manifest-path integration-tests/Cargo.toml --test economic -- --nocapture
      - name: LiteSVM grace lifecycle test
        run: cargo test --manifest-path integration-tests/Cargo.toml --test lifecycle -- --nocapture
      - name: LiteSVM expiry test
        run: cargo test --manifest-path integration-tests/Cargo.toml --test expiry -- --nocapture
      - name: LiteSVM ten-level network test
        run: cargo test --manifest-path integration-tests/Cargo.toml --test network -- --nocapture
      - name: Persist validated mint hardening
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- programs/service_referral_protocol/src/lib.rs scripts/static-gates.py integration-tests/src/lib.rs; then
            echo "Mint hardening already persisted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs scripts/static-gates.py integration-tests/src/lib.rs
          git commit -m "enforce typed six-decimal stablecoin mints"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-v0.9
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
