name: protocol-ci
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Apply V0.9B migration for diagnostic build
        run: |
          python3 scripts/run-v0-9b-migration.py
          git diff -- programs/service_referral_protocol/src/lib.rs
      - name: Build V0.9B diagnostic
        run: anchor build --ignore-keys
      - name: Rust unit tests
        run: cargo test --workspace

  persist-v09b:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/solana-protocol-v0.8'
    needs: [reference-and-static, anchor-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/solana-protocol-v0.8
      - name: Persist tested V0.9B migration
        run: |
          python3 scripts/run-v0-9b-migration.py
          if git diff --quiet -- programs/service_referral_protocol/src/lib.rs; then
            echo "V0.9B migration already persisted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs
          git commit -m "implement V0.9B canonical settlement hardening"
          git push origin HEAD:agent/solana-protocol-v0.8
