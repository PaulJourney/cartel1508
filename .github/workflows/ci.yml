name: protocol-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Apply stack and LiteSVM compatibility validation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          program = Path('programs/service_referral_protocol/src/lib.rs')
          s = program.read_text()
          replacements = {
              "#[account(mut, seeds = [b\"protocol\"], bump = protocol.bump)] pub protocol: Account<'info, ProtocolState>,\n    #[account(mut, seeds = [b\"user\", wallet.key().as_ref()], bump = user.bump)] pub user: Account<'info, UserState>,\n    #[account(mut)] pub user_source: Account<'info, TokenAccount>,":
              "#[account(mut, seeds = [b\"protocol\"], bump = protocol.bump)] pub protocol: Box<Account<'info, ProtocolState>>,\n    #[account(mut, seeds = [b\"user\", wallet.key().as_ref()], bump = user.bump)] pub user: Box<Account<'info, UserState>>,\n    #[account(mut)] pub user_source: Box<Account<'info, TokenAccount>>,",
              "#[account(mut)] pub usdt_vault: Account<'info, TokenAccount>,\n    #[account(mut)] pub usdc_vault: Account<'info, TokenAccount>,\n    #[account(mut)] pub service_treasury_usdt: Account<'info, TokenAccount>,\n    #[account(mut)] pub service_treasury_usdc: Account<'info, TokenAccount>,":
              "#[account(mut)] pub usdt_vault: Box<Account<'info, TokenAccount>>,\n    #[account(mut)] pub usdc_vault: Box<Account<'info, TokenAccount>>,\n    #[account(mut)] pub service_treasury_usdt: Box<Account<'info, TokenAccount>>,\n    #[account(mut)] pub service_treasury_usdc: Box<Account<'info, TokenAccount>>,",
              "#[account(mut, seeds = [b\"protocol\"], bump = protocol.bump)] pub protocol: Account<'info, ProtocolState>,\n    #[account(mut)] pub source_token: Account<'info, TokenAccount>,":
              "#[account(mut, seeds = [b\"protocol\"], bump = protocol.bump)] pub protocol: Box<Account<'info, ProtocolState>>,\n    #[account(mut)] pub source_token: Box<Account<'info, TokenAccount>>,",
              "#[account(mut)] pub vault_token: Account<'info, TokenAccount>,\n    #[account(mut)] pub service_treasury_token: Account<'info, TokenAccount>,\n    #[account(mut)] pub beneficiary: Account<'info, UserState>,":
              "#[account(mut)] pub vault_token: Box<Account<'info, TokenAccount>>,\n    #[account(mut)] pub service_treasury_token: Box<Account<'info, TokenAccount>>,\n    #[account(mut)] pub beneficiary: Box<Account<'info, UserState>>,
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected stack-patch pattern missing: {old[:80]!r}')
              s = s.replace(old, new, 1)
          program.write_text(s)

          tests = Path('integration-tests/src/lib.rs')
          t = tests.read_text()
          t = t.replace(
              'let registration_open_at = ctx.svm.get_unix_timestamp();',
              'let registration_open_at = ctx.svm.get_sysvar::<Clock>().unix_timestamp;',
          )
          marker = '        ctx.svm.set_sysvar(&clock);\n\n        let open_register_ix = ctx'
          replacement = '        ctx.svm.set_sysvar(&clock);\n        ctx.svm.expire_blockhash();\n\n        let open_register_ix = ctx'
          if marker not in t:
              raise SystemExit('expected registration retry marker missing')
          t = t.replace(marker, replacement, 1)
          tests.write_text(t)
          PY
      - name: Build clean V0.9 source
        run: anchor build --ignore-keys
      - name: Program Rust unit tests
        run: cargo test --workspace
      - name: LiteSVM integration tests
        run: cargo test --manifest-path integration-tests/Cargo.toml -- --nocapture
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-v0.9
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
