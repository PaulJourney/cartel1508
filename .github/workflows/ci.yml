name: protocol-ci
on: [pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py
      - run: cargo check --locked -p service_referral_protocol --features production
      - name: Build with frozen dependency graph
        run: |
          sha256sum Cargo.lock > /tmp/root-lock.sha256
          anchor build --ignore-keys
          sha256sum -c /tmp/root-lock.sha256
      - run: cargo test --locked --workspace
      - run: cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets -- --nocapture
      - name: Build production artifact with frozen dependency graph
        run: |
          sha256sum Cargo.lock > /tmp/root-lock.sha256
          anchor build --ignore-keys -- --features production
          sha256sum -c /tmp/root-lock.sha256
      - run: sha256sum target/deploy/service_referral_protocol.so | tee target/deploy/service_referral_protocol.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-build-v0.10-locked-production
          path: |
            target/deploy/service_referral_protocol.so
            target/deploy/service_referral_protocol.so.sha256
            target/idl/*.json
