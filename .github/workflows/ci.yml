name: protocol-ci
on: [pull_request]
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Reference economics
        run: node tests/reference-model.mjs
      - name: Rank/badge model
        run: node tests/rank-model.mjs
      - name: Static security/economic gates
        run: python3 scripts/static-gates.py
      - name: Prove pre-mainnet gate fails closed before final freeze
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          output="$(python3 scripts/pre-mainnet-gate.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'core Program ID is still a development identity' <<<"$output"
          grep -q 'registration_open_at is not frozen to a positive UTC unix timestamp' <<<"$output"
          grep -q 'Anchor.toml has no \[programs.mainnet\] Program ID' <<<"$output"
          grep -q 'release/mainnet-release.json is missing' <<<"$output"
      - name: Production compile check
        run: cargo check --locked -p service_referral_protocol --features production
      - name: Build development artifact with frozen dependency graph
        run: |
          sha256sum Cargo.lock > /tmp/root-lock.sha256
          anchor build --ignore-keys
          cp target/deploy/service_referral_protocol.so target/deploy/service_referral_protocol.dev.so
          sha256sum -c /tmp/root-lock.sha256
      - name: Core Rust tests
        run: cargo test --locked --workspace
      - name: Core integration/adversarial tests
        run: cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets -- --nocapture
      - name: Build production artifact with frozen dependency graph
        run: |
          sha256sum Cargo.lock > /tmp/root-lock.sha256
          anchor build --ignore-keys -- --features production
          sha256sum -c /tmp/root-lock.sha256
      - name: Hash production artifact
        run: sha256sum target/deploy/service_referral_protocol.so | tee target/deploy/service_referral_protocol.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: service-referral-protocol-core-production-candidate
          path: |
            target/deploy/service_referral_protocol.dev.so
            target/deploy/service_referral_protocol.so
            target/deploy/service_referral_protocol.so.sha256
            target/idl/*.json
          if-no-files-found: error
