name: protocol-ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Normalize stack-safe source and LiteSVM compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          program = Path('programs/service_referral_protocol/src/lib.rs')
          s = program.read_text()
          type_replacements = [
              ("Account<'info, ProtocolState>", "Box<Account<'info, ProtocolState>>"),
              ("Account<'info, UserState>", "Box<Account<'info, UserState>>"),
              ("Account<'info, TokenAccount>", "Box<Account<'info, TokenAccount>>"),
              ("Account<'info, UnitBatch>", "Box<Account<'info, UnitBatch>>"),
          ]
          for old, new in type_replacements:
              s = s.replace(old, new)
          program.write_text(s)

          tests = Path('integration-tests/src/lib.rs')
          t = tests.read_text()
          t = t.replace(
              'let registration_open_at = ctx.svm.get_unix_timestamp();',
              'let registration_open_at = ctx.svm.get_sysvar::<Clock>().unix_timestamp;',
          )
          marker = '        ctx.svm.set_sysvar(&clock);\n\n        let open_register_ix = ctx'
          replacement = '        ctx.svm.set_sysvar(&clock);\n        ctx.svm.expire_blockhash();\n\n        let open_register_ix = ctx'
          if marker in t:
              t = t.replace(marker, replacement, 1)
          tests.write_text(t)
          PY
      - name: Build V0.9 source
        run: anchor build --ignore-keys
      - name: Program Rust unit tests
        run: cargo test --workspace
      - name: LiteSVM integration tests
        run: cargo test --manifest-path integration-tests/Cargo.toml -- --nocapture
      - name: Persist validated source normalization
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- programs/service_referral_protocol/src/lib.rs integration-tests/src/lib.rs; then
            echo "Source already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs integration-tests/src/lib.rs
          git commit -m "make stack-safe Anchor accounts permanent"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-v0.9
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
