name: protocol-ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Build clean V0.9 source
        run: anchor build --ignore-keys
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-v0.9
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
