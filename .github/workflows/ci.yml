name: protocol-ci
on:
  push:
  pull_request:

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Anchor 1.1.2 binary
        run: |
          curl -L --fail --retry 3 \
            https://github.com/otter-sec/anchor/releases/download/v1.1.2/anchor-1.1.2-x86_64-unknown-linux-gnu \
            -o /tmp/anchor
          chmod +x /tmp/anchor
          sudo mv /tmp/anchor /usr/local/bin/anchor
          anchor --version
          solana --version
          rustc --version
      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            target/deploy/*.so
            target/idl/*.json
          if-no-files-found: error
