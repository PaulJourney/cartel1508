name: protocol-ci
on:
  push:
  pull_request:

jobs:
  reference-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/reference-model.mjs
      - run: python3 scripts/static-gates.py

  anchor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned Solana and Anchor toolchain
        uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Tool versions
        run: |
          solana --version
          anchor --version
          rustc --version
      - name: Preinstall sBPF platform tools with retries
        run: |
          for i in 1 2 3 4 5; do
            cargo-build-sbf --install-only && break
            if [ "$i" = "5" ]; then
              echo "platform-tools installation failed after retries" >&2
              exit 1
            fi
            sleep $((i * 5))
          done
      - name: Apply Anchor 1.x compatibility patches for diagnostic build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('programs/service_referral_protocol/src/lib.rs')
          s = p.read_text()
          s = s.replace('constants::assert_percentages().map_err(|_| ProtocolError::InvalidPercentages)?;', 'require!(constants::percentages_valid(), ProtocolError::InvalidPercentages);')
          s = s.replace('pub fn record_qualified_revenue(ctx: Context<RecordQualifiedRevenue>, amount: u64) -> Result<()> {', "pub fn record_qualified_revenue<'info>(ctx: Context<'info, RecordQualifiedRevenue<'info>>, amount: u64) -> Result<()> {")
          s = s.replace('ctx.accounts.token_program.to_account_info(),\n                Transfer {', 'token::ID,\n                Transfer {')
          s = s.replace('token_program.to_account_info(),\n            Transfer {', 'token::ID,\n            Transfer {')
          for i in range(1, 11):
              s = s.replace(f'ctx.accounts.upline_{i}.to_account_info()', f'ctx.accounts.upline_{i}.as_ref()')
          p.write_text(s)
          PY
          git diff -- programs/service_referral_protocol/src/lib.rs
      - name: Build diagnostic
        run: anchor build --ignore-keys
      - name: Rust unit tests
        run: cargo test --workspace
