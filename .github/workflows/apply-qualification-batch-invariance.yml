name: apply-qualification-batch-invariance

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/apply-qualification-batch-invariance.py
      - .github/workflows/apply-qualification-batch-invariance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Apply hardening
        run: python3 scripts/apply-qualification-batch-invariance.py
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/apply-qualification-batch-invariance.py .github/workflows/apply-qualification-batch-invariance.yml
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "Hardening already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs scripts/static-gates.py integration-tests/tests/batching_equivalence.rs README.md
          git commit -m "preserve SELF economics across split qualification purchases"
          git push origin HEAD:agent/qualified-revenue-final-integration
