name: self-first-economic-migration

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/migrate-self-first-economics.py
      - .github/workflows/self-first-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Apply deterministic economic migration
        run: python3 scripts/migrate-self-first-economics.py
      - name: Validate patch shape
        run: |
          git diff --check
          git diff --exit-code -- scripts/migrate-self-first-economics.py .github/workflows/self-first-migration.yml
      - name: Commit migrated production surface
        run: |
          if git diff --quiet; then
            echo "Migration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol integration-tests scripts/static-gates.py scripts/devnet-transaction-smoke.mjs tests/reference-model.mjs
          git commit -m "migrate economics to SELF plus nine uplines"
          git push origin HEAD:agent/qualified-revenue-final-integration
