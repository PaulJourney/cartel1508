name: consolidate-evidence-gates
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/consolidate-evidence-gates.yml'
permissions:
  contents: write
jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only

      - name: Consolidate evidence-bound callers and release gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Migrate the real-validator/localnet smoke from a freely variable nonce
          # to the reviewed evidence hash and exactly mirror the on-chain PDA seed order.
          smoke = Path('scripts/qualification-localnet-smoke.mjs')
          s = smoke.read_text()
          s = s.replace(
              'function eventId(qualificationProgramId, payer, beneficiary, mint, amount, nonce) {',
              'function eventId(qualificationProgramId, payer, beneficiary, mint, amount, evidenceHash) {'
          )
          s = s.replace(
              '[EVENT_DOMAIN, payer.toBuffer(), beneficiary.toBuffer(), mint.toBuffer(), u64le(amount), nonce]',
              '[EVENT_DOMAIN, evidenceHash, payer.toBuffer(), beneficiary.toBuffer(), mint.toBuffer(), u64le(amount)]'
          )
          s = s.replace('nonce1', 'evidenceHash1')
          s = s.replace('nonce2', 'evidenceHash2')
          s = s.replace('nonce3', 'evidenceHash3')
          smoke.write_text(s)

          # 2. Migrate the LiteSVM end-to-end test to the exact current instruction ABI
          # and exact on-chain event-id derivation.
          e2e = Path('integration-tests/tests/qualification_e2e.rs')
          r = e2e.read_text()
          r = r.replace('    nonce: [u8; 32],', '    evidence_hash: [u8; 32],')
          old_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n            &nonce,\n        ],'''
          new_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            evidence_hash.as_ref(),\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n        ],'''
          if old_seeds not in r:
              raise SystemExit('old E2E event seed layout not found')
          r = r.replace(old_seeds, new_seeds, 1)
          r = r.replace('nonce_1', 'evidence_hash_1')
          r = r.replace('nonce_2', 'evidence_hash_2')
          r = r.replace('client_nonce:', 'evidence_hash:')
          if 'client_nonce:' in r or 'nonce_1' in r or 'nonce_2' in r or '&nonce' in r:
              raise SystemExit('stale nonce API remains in qualification_e2e.rs')

          # LiteSVM's token-mint test helper can leave a just-created mint account present
          # but uninitialized in this larger CPI fixture. Do not fake account bytes: inspect
          # the real legacy SPL Mint state and, only when required, initialize it with the
          # real SPL Token initialize_mint2 instruction before Anchor deserializes Account<Mint>.
          mint_anchor = '''    let usdc_mint = ctx\n        .svm\n        .create_token_mint(&initializer, 6)\n        .expect("USDC mint");\n'''
          mint_guard = mint_anchor + '''\n    for mint_key in [usdt_mint.pubkey(), usdc_mint.pubkey()] {\n        let before = ctx.svm.get_account(&mint_key).expect("mint account exists");\n        assert_eq!(before.owner, spl_token::id(), "mint must be owned by legacy SPL Token");\n        assert_eq!(before.data.len(), 82, "legacy SPL Mint layout must be 82 bytes");\n        if before.data[45] != 1 {\n            let initialize_mint_ix = spl_token::instruction::initialize_mint2(\n                &spl_token::id(),\n                &mint_key,\n                &initializer.pubkey(),\n                None,\n                6,\n            )\n            .expect("build initialize_mint2");\n            let initialize_mint_tx = Transaction::new_signed_with_payer(\n                &[initialize_mint_ix],\n                Some(&initializer.pubkey()),\n                &[&initializer],\n                ctx.svm.latest_blockhash(),\n            );\n            ctx.svm\n                .send_transaction(initialize_mint_tx)\n                .expect("initialize legacy SPL mint");\n        }\n        let after = ctx.svm.get_account(&mint_key).expect("initialized mint exists");\n        assert_eq!(after.owner, spl_token::id());\n        assert_eq!(after.data.len(), 82);\n        assert_eq!(after.data[45], 1, "SPL Mint must be initialized before protocol initialize");\n    }\n'''
          if 'SPL Mint must be initialized before protocol initialize' not in r:
              if mint_anchor not in r:
                  raise SystemExit('E2E mint setup anchor not found')
              r = r.replace(mint_anchor, mint_guard, 1)
          e2e.write_text(r)

          # 3. Static gates now assert evidence-bound identity and explicit core adapter binding.
          static = Path('scripts/static-gates.py')
          g = static.read_text()
          old_check = "    'qualification event identity binds payer beneficiary mint amount nonce': all(x in qualification for x in ['payer_key.as_ref()', 'beneficiary_key.as_ref()', 'mint.as_ref()', '&amount_bytes', '&client_nonce']),"
          new_check = "    'qualification event identity binds evidence payer beneficiary mint amount': all(x in qualification for x in ['evidence_hash.as_ref()', 'payer_key.as_ref()', 'beneficiary_key.as_ref()', 'mint.as_ref()', '&amount_bytes']),"
          if old_check in g:
              g = g.replace(old_check, new_check)
          marker = "    'production launch source/time constants exist':"
          if 'core production adapter binding constant exists' not in g:
              if marker not in g:
                  raise SystemExit('static gate insertion marker not found')
              g = g.replace(
                  marker,
                  "    'core production adapter binding constant exists': 'MAINNET_REVENUE_ADAPTER_PROGRAM' in constants,\n" + marker,
                  1,
              )
          if 'amount nonce' in g or '&client_nonce' in g:
              raise SystemExit('stale nonce static gate remains')
          static.write_text(g)

          # 4. Top-level gate delegates to the dedicated qualification release gate and
          # hashes the final qualification specification rather than the architecture note.
          gate = Path('scripts/pre-mainnet-gate.py')
          p = gate.read_text()
          import_line = 'from qualification_release_gate import evaluate as evaluate_qualification_release\n'
          if import_line not in p:
              p = p.replace('from pathlib import Path\n', 'from pathlib import Path\n\n' + import_line, 1)
          p = p.replace(
              'QUALIFICATION_SPEC = ROOT / "QUALIFIED_REVENUE_SOURCE_SPEC.md"',
              'QUALIFICATION_SPEC = ROOT / "QUALIFIED_REVENUE_QUALIFICATION_SPEC.md"',
          )
          main_marker = '    blockers: list[str] = []\n    notes: list[str] = []\n'
          eval_block = '''    qualification_blockers, qualification_notes = evaluate_qualification_release(ROOT)\n    blockers.extend(qualification_blockers)\n    notes.extend(qualification_notes)\n'''
          if eval_block not in p:
              if main_marker not in p:
                  raise SystemExit('pre-mainnet main marker not found')
              p = p.replace(main_marker, main_marker + '\n' + eval_block, 1)
          gate.write_text(p)
          PY

      - name: Verify consolidated three-program graph
        run: |
          cargo check --locked --workspace
          anchor build --ignore-keys
          cargo test --locked --workspace
          cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets --no-run
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e -- --nocapture
          python3 scripts/static-gates.py
          set +e
          python3 scripts/qualification_release_gate.py | tee /tmp/qualification-gate.txt
          qstatus=${PIPESTATUS[0]}
          python3 scripts/pre-mainnet-gate.py | tee /tmp/pre-mainnet-gate.txt
          pstatus=${PIPESTATUS[0]}
          set -e
          test "$qstatus" -ne 0
          test "$pstatus" -ne 0
          grep -q 'QUALIFIED_REVENUE_QUALIFICATION_SPEC.md is not FINAL' /tmp/qualification-gate.txt
          grep -q 'core MAINNET_REVENUE_ADAPTER_PROGRAM is still fail-closed' /tmp/qualification-gate.txt
          grep -q 'PDA derivation self-test passed against real-validator vectors' /tmp/pre-mainnet-gate.txt
          grep -q 'RESULT: BLOCKED' /tmp/pre-mainnet-gate.txt

      - name: Commit consolidated migration and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qualification-localnet-smoke.mjs integration-tests/tests/qualification_e2e.rs scripts/static-gates.py scripts/pre-mainnet-gate.py
          if [ -f .github/workflows/evidence-api-migration.yml ]; then git rm .github/workflows/evidence-api-migration.yml; fi
          git rm .github/workflows/consolidate-evidence-gates.yml
          git commit -m 'consolidate evidence-bound qualification release gates'
          git push origin HEAD:agent/revenue-adapter-v0.1
