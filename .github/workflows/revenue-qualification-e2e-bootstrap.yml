name: revenue-qualification-e2e-bootstrap
on:
  push:
    branches: [agent/revenue-qualification-e2e]
concurrency:
  group: revenue-qualification-e2e-bootstrap
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  fixture-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-qualification-e2e
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Generate fixture lock and compile host graph
        run: |
          cargo generate-lockfile --manifest-path integration-tests/fixtures/evidence_stub/Cargo.toml
          cargo check --locked --manifest-path integration-tests/fixtures/evidence_stub/Cargo.toml
      - name: Build test evidence SBF
        run: |
          mkdir -p target/deploy
          cd integration-tests/fixtures/evidence_stub
          cargo build-sbf --sbf-out-dir ../../../target/deploy -- --locked
          test -s ../../../target/deploy/test_revenue_evidence_stub.so
      - name: Commit fixture lock and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/fixtures/evidence_stub/Cargo.lock
          git rm .github/workflows/revenue-qualification-e2e-bootstrap.yml
          git commit -m 'lock test revenue evidence fixture dependencies'
          git push origin HEAD:agent/revenue-qualification-e2e
