name: revenue-adapter-integration-lock-sync
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
permissions:
  contents: write
jobs:
  sync-integration-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Generate integration lock and run adapter runtime tests
        run: |
          cargo generate-lockfile --manifest-path integration-tests/Cargo.toml
          anchor build --ignore-keys
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test revenue_adapter_security -- --nocapture
      - name: Commit lock and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration-tests/Cargo.lock
          git rm .github/workflows/revenue-adapter-integration-lock-sync.yml
          git commit -m 'lock revenue adapter integration dependencies'
          git push origin HEAD:agent/revenue-adapter-v0.1
