name: revenue-qualification-lock-sync
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
permissions:
  contents: write
jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Generate lock and compile all programs
        run: |
          cargo generate-lockfile
          cargo check --workspace
          cargo test --workspace
          anchor build --ignore-keys
      - name: Commit generated lock and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git rm .github/workflows/revenue-qualification-lock-sync.yml
          git commit -m 'lock revenue qualification dependencies'
          git push origin HEAD:agent/revenue-adapter-v0.1
