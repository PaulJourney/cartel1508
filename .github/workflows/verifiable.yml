name: verifiable-build
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - 'programs/service_referral_protocol/**'
      - 'programs/revenue_adapter/**'
      - 'programs/revenue_qualification/**'
      - 'scripts/pre-mainnet-gate.py'
      - 'scripts/qualification_release_gate.py'
      - 'release/**'
      - 'QUALIFIED_REVENUE_SOURCE_SPEC.md'
      - 'QUALIFIED_REVENUE_QUALIFICATION_SPEC.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'
      - '.github/workflows/verifiable.yml'
  pull_request:
    paths:
      - 'programs/service_referral_protocol/**'
      - 'programs/revenue_adapter/**'
      - 'programs/revenue_qualification/**'
      - 'scripts/pre-mainnet-gate.py'
      - 'scripts/qualification_release_gate.py'
      - 'release/**'
      - 'QUALIFIED_REVENUE_SOURCE_SPEC.md'
      - 'QUALIFIED_REVENUE_QUALIFICATION_SPEC.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Anchor.toml'
      - '.github/workflows/verifiable.yml'
permissions:
  contents: read
jobs:
  docker-verifiable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Verify locked production graph before Docker build
        run: cargo check --locked --workspace --features production
      - name: Verifiable three-program production build
        run: anchor build --verifiable --ignore-keys -- --features production
      - name: Require and hash all verifiable artifacts
        run: |
          test -s target/verifiable/service_referral_protocol.so
          test -s target/verifiable/revenue_adapter.so
          test -s target/verifiable/revenue_qualification.so
          sha256sum target/verifiable/service_referral_protocol.so | tee target/verifiable/service_referral_protocol.so.sha256
          sha256sum target/verifiable/revenue_adapter.so | tee target/verifiable/revenue_adapter.so.sha256
          sha256sum target/verifiable/revenue_qualification.so | tee target/verifiable/revenue_qualification.so.sha256
      - name: Require final READY gate only after manifest freeze
        run: |
          if [ -f release/mainnet-release.json ]; then
            python3 scripts/pre-mainnet-gate.py
          else
            echo 'No final manifest: verifiable build is development evidence only; mainnet remains fail-closed.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-verifiable-three-program-production
          path: |
            target/verifiable/service_referral_protocol.so
            target/verifiable/service_referral_protocol.so.sha256
            target/verifiable/revenue_adapter.so
            target/verifiable/revenue_adapter.so.sha256
            target/verifiable/revenue_qualification.so
            target/verifiable/revenue_qualification.so.sha256
            target/idl/*.json
            Cargo.lock
          if-no-files-found: error
