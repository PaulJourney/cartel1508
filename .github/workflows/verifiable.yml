name: verifiable-build
on: [pull_request]
permissions:
  contents: read
jobs:
  docker-verifiable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Verifiable production build
        working-directory: programs/service_referral_protocol
        run: anchor build --verifiable --ignore-keys -- --features production
