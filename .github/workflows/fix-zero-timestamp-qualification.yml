name: fix-zero-timestamp-qualification

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/fix-zero-timestamp-qualification.py
      - .github/workflows/fix-zero-timestamp-qualification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Apply qualification sentinel fix
        run: python3 scripts/fix-zero-timestamp-qualification.py
      - name: Validate patch
        run: git diff --check
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs/service_referral_protocol/src/lib.rs
          git commit -m "use qualification progress as window sentinel"
          git push origin HEAD:agent/qualified-revenue-final-integration
