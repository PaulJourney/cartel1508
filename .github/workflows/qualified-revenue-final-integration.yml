name: qualified-revenue-final-integration

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
  pull_request:

permissions:
  contents: read

jobs:
  qualification-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only

      - name: Core reference and static gates
        run: |
          node tests/reference-model.mjs
          python3 scripts/static-gates.py
          cargo test --locked --workspace

      - name: Build hardened core development SBF
        run: anchor build --ignore-keys

      - name: Hardened Revenue Adapter checks and SBF
        working-directory: programs/revenue_adapter
        run: |
          cargo generate-lockfile
          cargo check --locked
          cargo test --locked
          cargo build-sbf -- --locked

      - name: Qualification gateway checks and SBF
        working-directory: programs/revenue_qualification
        run: |
          cargo generate-lockfile
          cargo check --locked
          cargo test --locked
          cargo build-sbf -- --locked

      - name: Test evidence fixture checks and SBF
        working-directory: integration-tests/fixtures/evidence_stub
        run: |
          cargo generate-lockfile
          cargo check --locked
          cargo build-sbf -- --locked
          set +e
          output="$(cargo check --locked --features production 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -q 'TEST-ONLY fixture' <<<"$output"

      - name: Stage four-program chain artifacts
        run: |
          mkdir -p target/deploy
          cp programs/revenue_adapter/target/deploy/revenue_adapter.so target/deploy/revenue_adapter.so
          cp programs/revenue_qualification/target/deploy/revenue_qualification.so target/deploy/revenue_qualification.so
          cp integration-tests/fixtures/evidence_stub/target/deploy/test_revenue_evidence_stub.so target/deploy/test_revenue_evidence_stub.so
          test -f target/deploy/service_referral_protocol.so
          sha256sum target/deploy/service_referral_protocol.so target/deploy/revenue_adapter.so target/deploy/revenue_qualification.so target/deploy/test_revenue_evidence_stub.so

      - name: Run full regression and hardened qualified-revenue e2e
        working-directory: integration-tests
        run: |
          cargo generate-lockfile
          cargo test --locked --all-targets -- --nocapture

      - name: Production identities remain fail closed before final freeze
        run: |
          cargo check --manifest-path programs/revenue_adapter/Cargo.toml --locked --features production
          cargo check --manifest-path programs/revenue_qualification/Cargo.toml --locked --features production
          grep -q 'MAINNET_VERIFIER_PROGRAM' programs/revenue_adapter/src/lib.rs
          grep -q '11111111111111111111111111111111' programs/revenue_adapter/src/lib.rs
          grep -q 'MAINNET_EVIDENCE_PROGRAM' programs/revenue_qualification/src/lib.rs
          grep -q '11111111111111111111111111111111' programs/revenue_qualification/src/lib.rs
