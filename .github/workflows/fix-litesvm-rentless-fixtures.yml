name: fix-litesvm-rentless-fixtures

on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/fix-litesvm-rentless-fixtures.py
      - .github/workflows/fix-litesvm-rentless-fixtures.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
          fetch-depth: 0
      - name: Apply exact fixture fix
        run: python3 scripts/fix-litesvm-rentless-fixtures.py
      - name: Validate patch
        run: git diff --check
      - name: Commit fix and remove temporary diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f LITESVM_DIAGNOSTIC.txt .github/workflows/litesvm-diagnostic.yml
          git rm -f scripts/fix-litesvm-rentless-fixtures.py .github/workflows/fix-litesvm-rentless-fixtures.yml
          git add integration-tests/tests
          git commit -m "fix rentless LiteSVM fixtures"
          git push origin HEAD:agent/qualified-revenue-final-integration
