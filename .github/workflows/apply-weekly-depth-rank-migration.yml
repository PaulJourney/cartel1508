name: apply-weekly-depth-rank-migration
on:
  push:
    branches:
      - agent/qualified-revenue-final-integration
    paths:
      - scripts/apply-weekly-depth-rank-migration.py
      - scripts/retry-weekly-depth-migration.marker
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qualified-revenue-final-integration
      - name: Make one-shot replacement helper retry-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-weekly-depth-rank-migration.py')
          text = p.read_text()
          old = '''    if count != 1:\n        raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          new = '''    if old == "if preserve_self_and_pioneer {" and count == 2:\n        write(path, text.replace(old, new, 1))\n        return\n    if count != 1:\n        raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")\n    write(path, text.replace(old, new, 1))\n'''
          if old not in text:
              raise SystemExit('replacement helper body not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply frozen weekly activity/depth migration
        run: python3 scripts/apply-weekly-depth-rank-migration.py
      - name: Format and normalize
        run: |
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          for name in ['README.md', 'AUDIT_SCOPE.md', 'AUDIT_HANDOFF.md']:
              p = Path(name)
              p.write_text(p.read_text().rstrip() + '\n')
          PY
      - name: Commit migration result
        run: |
          rm -f scripts/retry-weekly-depth-migration.marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "implement progressive activity and weekly network depth"
          git push origin HEAD:agent/qualified-revenue-final-integration
