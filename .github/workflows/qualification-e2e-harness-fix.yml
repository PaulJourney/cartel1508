name: qualification-e2e-harness-fix
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/qualification-e2e-harness-fix.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Apply corrected E2E harness transiently
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integration-tests/tests/qualification_e2e.rs')
          r = p.read_text()

          # Migrate qualification identity from caller nonce to external evidence hash.
          r = r.replace('    nonce: [u8; 32],', '    evidence_hash: [u8; 32],')
          old_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n            &nonce,\n        ],'''
          new_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            evidence_hash.as_ref(),\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n        ],'''
          if old_seeds not in r:
              raise SystemExit('old event seed layout missing')
          r = r.replace(old_seeds, new_seeds, 1)
          r = r.replace('nonce_1', 'evidence_hash_1').replace('nonce_2', 'evidence_hash_2')
          r = r.replace('client_nonce:', 'evidence_hash:')

          # Do not embed three BPF images into the same host test binary. The downstream
          # programs are only needed after the referral bootstrap, so load them at runtime.
          r = r.replace('use anchor_litesvm::{AnchorLiteSVM, AssertionHelpers, ProgramTestExt, TestHelpers};',
                        'use anchor_litesvm::{AnchorLiteSVM, AssertionHelpers, Program, ProgramTestExt, TestHelpers};')
          r = r.replace('const ADAPTER_BYTES: &[u8] = include_bytes!("../../target/deploy/revenue_adapter.so");\n', '')
          r = r.replace('const QUALIFICATION_BYTES: &[u8] = include_bytes!("../../target/deploy/revenue_qualification.so");\n', '')
          old_deploy = '''    // Only now add the two downstream CPI programs to the already-proven referral fixture.\n    ctx.deploy_program(revenue_adapter::ID, ADAPTER_BYTES);\n    ctx.deploy_program(revenue_qualification::ID, QUALIFICATION_BYTES);\n\n    ctx.program_id = revenue_adapter::ID;\n    let initialize_adapter_ix = ctx\n        .program()\n'''
          new_deploy = '''    // Only now add the two downstream CPI programs to the already-proven referral fixture.\n    // Cargo runs this integration test with integration-tests as the current directory.\n    let adapter_bytes = std::fs::read("../target/deploy/revenue_adapter.so")\n        .expect("read revenue adapter BPF image");\n    let qualification_bytes = std::fs::read("../target/deploy/revenue_qualification.so")\n        .expect("read revenue qualification BPF image");\n    ctx.deploy_program(revenue_adapter::ID, &adapter_bytes);\n    ctx.deploy_program(revenue_qualification::ID, &qualification_bytes);\n\n    // AnchorContext::program() remains bound to the program supplied at construction.\n    // Use explicit builders for every downstream program instead of mutating ctx.program_id.\n    let adapter_program = Program::new(revenue_adapter::ID);\n    let qualification_program = Program::new(revenue_qualification::ID);\n\n    let initialize_adapter_ix = adapter_program\n'''
          if old_deploy not in r:
              raise SystemExit('old downstream deployment/builder block missing')
          r = r.replace(old_deploy, new_deploy, 1)

          marker = '    ctx.program_id = revenue_qualification::ID;\n'
          if marker not in r:
              raise SystemExit('qualification program switch marker missing')
          r = r.replace(marker, '', 1)
          split_token = '    let evidence_hash_1 = [1u8; 32];'
          if split_token not in r:
              raise SystemExit('evidence event-1 marker missing after migration')
          before, after = r.split(split_token, 1)
          after = after.replace('ctx\n        .program()', 'qualification_program')
          r = before + split_token + after

          if 'client_nonce:' in r or '&nonce' in r or 'ctx.program_id =' in r:
              raise SystemExit('stale E2E API/program switch remains')
          p.write_text(r)
          PY
      - name: Build and run corrected three-program E2E
        run: |
          anchor build --ignore-keys
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e --no-run
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e -- --nocapture
