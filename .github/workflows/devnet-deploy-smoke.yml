name: devnet-deploy-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEVNET_DEPLOYER_KEYPAIR_JSON: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - name: Configure devnet identities
        run: |
          solana config set --url devnet
          mkdir -p ~/.config/solana target/deploy

          if [ -n "${DEVNET_DEPLOYER_KEYPAIR_JSON:-}" ]; then
            printf '%s' "$DEVNET_DEPLOYER_KEYPAIR_JSON" > ~/.config/solana/id.json
            chmod 600 ~/.config/solana/id.json
            echo "Using secret-backed devnet deployer keypair."
          else
            solana-keygen new --no-bip39-passphrase --silent --force -o ~/.config/solana/id.json
            chmod 600 ~/.config/solana/id.json
            echo "Using ephemeral devnet deployer keypair."
          fi

          solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/service_referral_protocol-keypair.json
          PROGRAM_ID="$(solana-keygen pubkey target/deploy/service_referral_protocol-keypair.json)"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          DEPLOYER="$(solana-keygen pubkey ~/.config/solana/id.json)"
          printf '%s\n' "$PROGRAM_ID" | tee /tmp/devnet-program-id.txt
          printf '%s\n' "$DEPLOYER" | tee /tmp/devnet-deployer-pubkey.txt

          python3 - "$PROGRAM_ID" <<'PY'
          from pathlib import Path
          import sys
          new_id = sys.argv[1]
          old_id = '4AuoBkj4vkH2K1jwUuECtVBqF6Q74efjGbaw7btuNjRV'
          for filename in ['programs/service_referral_protocol/src/lib.rs', 'Anchor.toml']:
              p = Path(filename)
              text = p.read_text()
              if old_id not in text:
                  raise SystemExit(f'expected development Program ID missing in {filename}')
              p.write_text(text.replace(old_id, new_id))
          PY
      - name: Ensure deployer has devnet SOL
        run: |
          BALANCE_LAMPORTS="$(solana balance --lamports --url devnet | awk '{print $1}')"
          if [ "$BALANCE_LAMPORTS" -lt 1000000000 ]; then
            for amount in 5 2 1; do
              solana airdrop "$amount" --url devnet || true
              BALANCE_LAMPORTS="$(solana balance --lamports --url devnet | awk '{print $1}')"
              if [ "$BALANCE_LAMPORTS" -ge 1000000000 ]; then
                break
              fi
              sleep 5
            done
          fi

          echo "devnet deployer balance: ${BALANCE_LAMPORTS} lamports"
          if [ "$BALANCE_LAMPORTS" -lt 1000000000 ]; then
            echo "DEVNET FUNDING BLOCKED: public faucet unavailable/rate-limited."
            echo "Re-run when the faucet is available, or configure GitHub secret DEVNET_DEPLOYER_KEYPAIR_JSON with a separately pre-funded disposable devnet wallet."
            exit 1
          fi
          solana balance --url devnet | tee /tmp/devnet-start-balance.txt
      - name: Build temporary-ID program
        run: |
          cargo-build-sbf --install-only
          anchor build --ignore-keys
          test -s target/deploy/service_referral_protocol.so
          test -s target/idl/service_referral_protocol.json
      - name: Deploy to devnet
        run: |
          solana program deploy target/deploy/service_referral_protocol.so \
            --program-id target/deploy/service_referral_protocol-keypair.json \
            --url devnet | tee /tmp/devnet-deploy.txt
          solana program show "$PROGRAM_ID" --url devnet | tee /tmp/devnet-program-show.txt
      - name: Install pinned smoke-client dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Execute final Pioneer production-equivalent transactions
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: ~/.config/solana/id.json
          PROTOCOL_IDL: target/idl/service_referral_protocol.json
        run: |
          npm run devnet:smoke | tee /tmp/devnet-transaction-smoke.txt
          grep -q 'DEVNET TRANSACTION SMOKE: PASS' /tmp/devnet-transaction-smoke.txt
      - name: Record final deployer balance
        if: always()
        run: solana balance --url devnet | tee /tmp/devnet-end-balance.txt || true
      - name: Publish only non-secret smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-transaction-smoke-evidence
          path: |
            /tmp/devnet-program-id.txt
            /tmp/devnet-deployer-pubkey.txt
            /tmp/devnet-deploy.txt
            /tmp/devnet-program-show.txt
            /tmp/devnet-start-balance.txt
            /tmp/devnet-end-balance.txt
            /tmp/devnet-transaction-smoke.txt
          if-no-files-found: warn
