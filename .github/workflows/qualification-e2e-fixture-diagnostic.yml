name: qualification-e2e-fixture-diagnostic
on:
  push:
    branches: [agent/revenue-adapter-v0.1]
    paths:
      - '.github/workflows/qualification-e2e-fixture-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revenue-adapter-v0.1
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: '3.1.10'
          anchor_version: '1.1.2'
          node_version: '24'
      - run: cargo-build-sbf --install-only
      - name: Align E2E API and reduce pre-initialize fixture to proven core sequence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e2e = Path('integration-tests/tests/qualification_e2e.rs')
          r = e2e.read_text()
          r = r.replace('    nonce: [u8; 32],', '    evidence_hash: [u8; 32],')
          old_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n            &nonce,\n        ],'''
          new_seeds = '''        &[\n            revenue_qualification::EVENT_DOMAIN,\n            evidence_hash.as_ref(),\n            payer.as_ref(),\n            beneficiary.as_ref(),\n            mint.as_ref(),\n            &amount_bytes,\n        ],'''
          if old_seeds not in r:
              raise SystemExit('old event seed layout not found')
          r = r.replace(old_seeds, new_seeds, 1)
          r = r.replace('nonce_1', 'evidence_hash_1')
          r = r.replace('nonce_2', 'evidence_hash_2')
          r = r.replace('client_nonce:', 'evidence_hash:')

          # Match the already-proven economic.rs setup exactly through core Initialize.
          r = r.replace('create_funded_account(40_000_000_000)', 'create_funded_account(30_000_000_000)', 1)
          old_downstream = '''    // These addresses are deterministic and can be frozen by the referral protocol before\n    // either downstream program is deployed in the test VM.\n    let (adapter_config, _) =\n        Pubkey::find_program_address(&[CONFIG_SEED], &revenue_adapter::ID);\n    let (revenue_authority, _) =\n        Pubkey::find_program_address(&[REVENUE_AUTHORITY_SEED], &revenue_adapter::ID);\n    let (qualification_authority, _) = Pubkey::find_program_address(\n        &[revenue_qualification::QUALIFIER_AUTHORITY_SEED],\n        &revenue_qualification::ID,\n    );\n'''
          new_downstream = '''    // Core initialization needs only the immutable adapter RevenueAuthority PDA.\n    // All other downstream addresses are deliberately derived after the proven core fixture.\n    let (revenue_authority, _) =\n        Pubkey::find_program_address(&[REVENUE_AUTHORITY_SEED], &revenue_adapter::ID);\n'''
          if old_downstream not in r:
              raise SystemExit('pre-initialize downstream PDA block not found')
          r = r.replace(old_downstream, new_downstream, 1)
          deploy_anchor = '''    ctx.deploy_program(revenue_adapter::ID, ADAPTER_BYTES);\n    ctx.deploy_program(revenue_qualification::ID, QUALIFICATION_BYTES);\n'''
          delayed = deploy_anchor + '''\n    let (adapter_config, _) =\n        Pubkey::find_program_address(&[CONFIG_SEED], &revenue_adapter::ID);\n    let (qualification_authority, _) = Pubkey::find_program_address(\n        &[revenue_qualification::QUALIFIER_AUTHORITY_SEED],\n        &revenue_qualification::ID,\n    );\n'''
          if deploy_anchor not in r:
              raise SystemExit('downstream deploy anchor not found')
          r = r.replace(deploy_anchor, delayed, 1)
          if 'client_nonce:' in r or '&nonce' in r:
              raise SystemExit('stale nonce API remains')
          e2e.write_text(r)
          PY
      - name: Build and compare control with reduced target
        run: |
          anchor build --ignore-keys
          cargo test --locked --manifest-path integration-tests/Cargo.toml --all-targets --no-run
          echo '=== CONTROL ==='
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test economic -- --nocapture
          echo '=== REDUCED TARGET ==='
          cargo test --locked --manifest-path integration-tests/Cargo.toml --test qualification_e2e -- --nocapture
